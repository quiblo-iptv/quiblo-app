# A merge to main is a release.
#
# Three jobs in a line, and the order is the whole point: nothing is versioned until the
# gate is green, and nothing is published until it is versioned. The gate and the release
# procedure are both reused from the files that already define them (ci.yml, release.yml)
# rather than copied here — a second copy of a build is a second thing to keep true.
name: Release on merge to main

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Serialised, never cancelled. Two merges landing a minute apart must not both bump from the
# same version, and a release cancelled halfway leaves a tag with no build behind it — the
# one state on the releases page that cannot be fixed by running something again.
concurrency:
  group: release-on-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Exactly what a pull request has to pass. Assemble, unit tests, detekt, parser coverage
  # and Android Lint.
  gate:
    name: Gate
    uses: ./.github/workflows/ci.yml

  version:
    name: Bump the version and tag it
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      release: ${{ steps.class.outputs.release }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          # The branch, not the commit that triggered this. A detached HEAD has nothing to
          # push the bump back onto.
          ref: ${{ github.ref_name }}
          # Tags are needed to tell an already-released version from a new one, and to find
          # where the last release ended so the step below knows what to read.
          fetch-depth: 0

      # Whether this merge releases at all, and as what.
      #
      # A merge to main is a release *when something released changed*. A typo in a README,
      # a new test, a CI tweak — none of those alter a single byte a user runs, and shipping
      # them as versions teaches people that release notes are not worth reading. The commit
      # types are already there to be read: every commit in this repository is written to
      # Conventional Commits, so the decision needs no new tool and no new discipline.
      #
      #   feat:            → minor    (docs/RELEASE-MANAGEMENT.md §1)
      #   fix:             → patch
      #   anything else    → no release; main moves, nothing publishes
      #   ! or BREAKING    → stop and ask a human (§2)
      #
      # Majors are deliberately *not* inferred. §2 defines a major by consequences a prefix
      # cannot see — an export format that stops loading, a raised minSdk, a withdrawn
      # feature — so a `!` somebody typed is a reason to stop and decide, not a licence to
      # spend the first number.
      - name: Work out the release class
        id: class
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
            echo "No tag yet — reading the whole history."
          else
            RANGE="$LAST_TAG..HEAD"
            echo "Reading commits since $LAST_TAG."
          fi

          # --no-merges because a merge commit's subject is prose, not a conventional type;
          # the commits it brings in are in the range on their own and carry the types.
          SUBJECTS=$(git log --no-merges --format='%s' "$RANGE" || true)
          BODIES=$(git log --no-merges --format='%B' "$RANGE" || true)

          if [ -z "$SUBJECTS" ]; then
            echo "::notice::No commits since $LAST_TAG. Nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Commits considered:"
          echo "$SUBJECTS" | sed 's/^/  /'

          # A trailing ! on the type, or a BREAKING CHANGE footer. Either is a claim that
          # something a user relies on stops working, and that is not ours to automate.
          if echo "$SUBJECTS" | grep -qE '^[a-z]+(\([^)]*\))?!:' || echo "$BODIES" | grep -q '^BREAKING CHANGE:'; then
            echo "::error::A breaking change is present, and a major is never inferred. Set the major version by hand in both build files and merge again — see docs/RELEASE-MANAGEMENT.md §2."
            exit 1
          fi

          if echo "$SUBJECTS" | grep -qE '^feat(\([^)]*\))?:'; then
            CLASS=minor
          elif echo "$SUBJECTS" | grep -qE '^fix(\([^)]*\))?:'; then
            CLASS=patch
          else
            CLASS=none
          fi

          # A version somebody set by hand is a release request in its own right.
          #
          # Found by trying to prove this lane rather than by reading it: RELEASE-MANAGEMENT.md
          # says the way to open a stage is to "set the version you want in the pull request",
          # and that could not work — a pull request that only edits two version numbers
          # carries no feat: and no fix:, so the class came out none and the publish was
          # skipped. The instruction and the lane disagreed, and the lane was going to win.
          #
          # So: if versionName differs from what it was at the last tag, publish. The class
          # then only decides how a *bare* version moves; a pre-release advances its own
          # counter regardless, and a hand-set version with nothing releasable behind it takes
          # the smallest step rather than none at all.
          HAND_SET=false
          if [ -n "$LAST_TAG" ]; then
            NAME_NOW=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n 1 || true)
            NAME_THEN=$(git show "$LAST_TAG:app/build.gradle.kts" 2>/dev/null | grep -oP 'versionName = "\K[^"]+' | head -n 1 || true)
            if [ -n "$NAME_NOW" ] && [ -n "$NAME_THEN" ] && [ "$NAME_NOW" != "$NAME_THEN" ]; then
              HAND_SET=true
              echo "::notice::versionName was set by hand ($NAME_THEN → $NAME_NOW), which is a release request."
            fi
          fi

          if [ "$CLASS" = "none" ] && [ "$HAND_SET" = "false" ]; then
            echo "::notice::Nothing here changes what a user runs — no feat: or fix: since ${LAST_TAG:-the beginning}, and the version was not set by hand. Main is updated and no release is published."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CLASS" = "none" ]; then
            CLASS=patch
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "class=$CLASS" >> "$GITHUB_OUTPUT"
          echo "Release class: $CLASS"

      # Checked here, before anything is written, rather than where it is used.
      #
      # The signing step is most of the way through the *next* job, and by then this one has
      # already committed a version bump to main and pushed a tag. A missing secret would
      # leave the repository claiming to have released a version that has no release — and
      # the guard below, which refuses to reuse a tag, would then block the retry. Failing
      # here costs a red run and changes nothing.
      - name: Check the release can be signed
        if: steps.class.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.QUIBLO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::QUIBLO_KEYSTORE_BASE64 is not set, so nothing merged to main can be released. Add the four signing secrets (see docs/RELEASING.md) — no version has been bumped and no tag has been cut."
            exit 1
          fi

      - name: Work out the next version
        id: bump
        if: steps.class.outputs.release == 'true'
        env:
          CLASS: ${{ steps.class.outputs.class }}
        run: |
          set -euo pipefail

          # :app is the reference for both. The two application ids keep their own sequences
          # in principle (docs/RELEASING.md), and in practice have always been in step —
          # letting them drift would mean two numbers to reason about and one release to
          # name, so they are moved together and asserted equal below.
          # `|| true` on every one of these. Under `set -o pipefail` a grep that matches
          # nothing fails the whole pipeline, which would abort the step before the checks
          # below could say what was actually wrong — a build file that had been reformatted
          # would fail with a bare exit code and no clue.
          # Whatever is between the quotes, not "three numbers".
          #
          # It used to read `[0-9]+\.[0-9]+\.[0-9]+`, which is why a pre-release could not be
          # published under its own name: `1.0.0-beta.1` was read as `1.0.0`, the versionName
          # sed below then matched nothing while the versionCode sed beside it still fired, and
          # `main` would have been tagged v1.0.1 against build files saying 1.0.0-beta.1. The
          # shape is validated immediately below instead, where a wrong one can be reported.
          CURRENT_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n 1 || true)
          CURRENT_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -n 1 || true)

          if [ -z "$CURRENT_NAME" ] || [ -z "$CURRENT_CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts."
            exit 1
          fi

          TV_NAME=$(grep -oP 'versionName = "\K[^"]+' app-tv/build.gradle.kts | head -n 1 || true)
          TV_CODE=$(grep -oP 'versionCode = \K[0-9]+' app-tv/build.gradle.kts | head -n 1 || true)
          if [ "$TV_NAME" != "$CURRENT_NAME" ] || [ "$TV_CODE" != "$CURRENT_CODE" ]; then
            echo "::error::app is $CURRENT_NAME/$CURRENT_CODE but app-tv is $TV_NAME/$TV_CODE. They are released together under one tag, so they must start from the same version."
            exit 1
          fi

          # Two shapes are legal, and which one is in the build files decides how it moves.
          if printf '%s' "$CURRENT_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'; then
            # A pre-release advances its own counter and nothing else.
            #
            # X.Y.Z was chosen by hand in the pull request that opened the stage, and the
            # stage's meaning is a claim about the software that no commit prefix can make —
            # RELEASE-MANAGEMENT.md §3 and §5. So a feat: landing during 1.0.0-beta.1 gives
            # 1.0.0-beta.2, not 1.1.0-beta.1: it is part of what 1.0.0 will be. Moving from
            # beta to rc, or from rc to the final, stays a deliberate edit in a pull request.
            BASE="${CURRENT_NAME%%-*}"
            SUFFIX="${CURRENT_NAME#*-}"
            STAGE="${SUFFIX%%.*}"
            STAGE_NUMBER="${SUFFIX##*.}"
            NEXT_NAME="$BASE-$STAGE.$((STAGE_NUMBER + 1))"
          elif printf '%s' "$CURRENT_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            # Which number moves is the class the step above worked out, not a fixed choice.
            # A minor resets the patch: 0.2.2 with a feat: in it becomes 0.3.0, not 0.2.3.
            IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT_NAME"
            case "$CLASS" in
              minor) NEXT_NAME="$MAJOR.$((MINOR + 1)).0" ;;
              patch) NEXT_NAME="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              *)
                echo "::error::Unknown release class '$CLASS'. This job should not have run."
                exit 1
                ;;
            esac
          else
            echo "::error::versionName is '$CURRENT_NAME', which is neither X.Y.Z nor X.Y.Z-<alpha|beta|rc>.N. Nothing has been bumped or tagged. See docs/RELEASE-MANAGEMENT.md §6."
            exit 1
          fi

          # versionCode never expresses the class — Android only requires that it increases,
          # and the name carries the meaning. See docs/RELEASE-MANAGEMENT.md §6.
          NEXT_CODE=$((CURRENT_CODE + 1))
          TAG="v$NEXT_NAME"

          # A tag that already exists means this version has been released before, and
          # overwriting it would change what a published download contains.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Bump the version by hand and merge again."
            exit 1
          fi

          for FILE in app/build.gradle.kts app-tv/build.gradle.kts; do
            sed -i -E "s/versionCode = [0-9]+/versionCode = $NEXT_CODE/" "$FILE"
            sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$NEXT_NAME\"/" "$FILE"
          done

          # A sed that matched nothing exits 0 and changes nothing, which would tag an
          # unchanged version and publish a second release of it.
          if [ -z "$(git diff --name-only)" ]; then
            echo "::error::The version bump changed no files. Check the versionCode and versionName lines in both build files."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $CURRENT_NAME (code $CURRENT_CODE) → $NEXT_NAME (code $NEXT_CODE), a $CLASS."

      - name: Commit and tag
        if: steps.class.outputs.release == 'true'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # [skip ci] is belt and braces: a push made with GITHUB_TOKEN does not start
          # another workflow run, so this cannot loop even without it.
          git add app/build.gradle.kts app-tv/build.gradle.kts
          git commit -m "chore(release): ${TAG#v} [skip ci]"
          git tag -a "$TAG" -m "Quiblo ${TAG#v}"

          # The branch first, then the tag. A tag pushed before its commit points at an
          # object main does not contain yet.
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "$TAG"

  publish:
    name: Publish
    needs: version
    # Skipped entirely when the merge changed nothing a user runs. The job does not fail in
    # that case, it does not exist — a red run for a corrected typo would be a worse lie
    # than a pointless release.
    if: needs.version.outputs.release == 'true'
    # The release procedure as release.yml defines it: signs both APKs, enforces the 25 MB
    # budget, writes the checksums and attaches all four files.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      # The gate above ran on this same tree. See `run-gate` in release.yml.
      run-gate: false
    secrets: inherit
