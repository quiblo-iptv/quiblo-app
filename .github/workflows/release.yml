name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.0)'
        required: true
  # Called by release-on-main.yml once it has cut the tag. Everything below — the gate, the
  # signing, the size budget, the checksums — is the release procedure, and it lives in one
  # file no matter which of the three ways a release was started.
  workflow_call:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.0)'
        required: true
        type: string
      run-gate:
        description: >-
          Run the full build-test-analyse gate before signing. Left on for a tag pushed by
          hand, which nothing has checked. The merge-to-main path turns it off, because it
          has just run that same gate on the same tree — the only difference between the two
          commits is two version numbers, and paying ten minutes of a free runner to
          re-prove that is the sort of cost nobody notices until releases take half an hour.
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # The same gate CI applies. A release is the worst possible moment to discover
      # the build is red. Skipped only when the caller has already run it — see `run-gate`.
      - name: Build, test and analyse
        if: ${{ inputs.run-gate != false }}
        run: ./gradlew build

      # Written outside the workspace so it cannot be picked up by a later step, and
      # removed in an always() step below whatever happens.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.QUIBLO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::QUIBLO_KEYSTORE_BASE64 is not set. A release must be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quiblo-release.jks"

      - name: Assemble signed release
        env:
          QUIBLO_KEYSTORE_FILE: ${{ runner.temp }}/quiblo-release.jks
          QUIBLO_KEYSTORE_PASSWORD: ${{ secrets.QUIBLO_KEYSTORE_PASSWORD }}
          QUIBLO_KEY_ALIAS: ${{ secrets.QUIBLO_KEY_ALIAS }}
          QUIBLO_KEY_PASSWORD: ${{ secrets.QUIBLO_KEY_PASSWORD }}
        # Two APKs, two application ids, one key. They are separate installs — a user may
        # have both — so the release ships both or it ships neither.
        run: ./gradlew :app:assembleRelease :app-tv:assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/quiblo-release.jks"

      # AC-NFR-02. Enforced rather than reported: a release that quietly grew past the
      # budget is exactly the kind of regression nobody notices until it ships. The TV
      # APK is held to the same budget — it carries no more than the phone does.
      - name: Check APK sizes against the 25 MB budget
        run: |
          set -euo pipefail
          LIMIT=$((25 * 1000 * 1000))
          for DIR in app app-tv; do
            APK=$(find "$DIR/build/outputs/apk/release" -name '*.apk' ! -name '*unsigned*' | head -n 1)
            if [ -z "$APK" ]; then
              echo "::error::No signed APK was produced for :$DIR."
              exit 1
            fi
            SIZE=$(stat -c%s "$APK")
            echo "APK: $APK"
            echo "Size: $((SIZE / 1000000)) MB (limit $((LIMIT / 1000000)) MB)"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::$APK is over the AC-NFR-02 budget."
              exit 1
            fi
          done

      # Named apart so the two are never confused on the releases page: installing the
      # phone APK on a television gets you an app the launcher will not show.
      - name: Name and checksum
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          for DIR in app app-tv; do
            case "$DIR" in
              app) NAME="quiblo-${TAG}.apk" ;;
              app-tv) NAME="quiblo-tv-${TAG}.apk" ;;
            esac
            cd "$GITHUB_WORKSPACE/$DIR/build/outputs/apk/release"
            APK=$(find . -name '*.apk' ! -name '*unsigned*' ! -name 'quiblo*' | head -n 1)
            cp "$APK" "$NAME"
            sha256sum "$NAME" > "${NAME}.sha256"
          done

      # A tag carrying -alpha, -beta or -rc is a pre-release and has to be published as one.
      #
      # Without this every tag published as the latest stable download, so `1.0.0-beta.1` would
      # have appeared as the current release of Quiblo beside no stable release at all — and
      # anybody arriving at the releases page would have installed a beta believing it was
      # finished. RELEASE-MANAGEMENT.md §6 sets out which suffixes mean what.
      - name: Decide whether this tag is a pre-release
        id: kind
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is a pre-release."
          elif printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is a full release."
          else
            # Refused rather than guessed. A tag this does not recognise is one nobody has
            # decided the meaning of, and the failure mode of guessing "stable" is a beta on
            # the front page.
            echo "::error::'$TAG' is neither vX.Y.Z nor vX.Y.Z-<alpha|beta|rc>.N. See docs/RELEASE-MANAGEMENT.md §6."
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # Published rather than held as a draft. Every release now comes from a merge that
          # passed the gate, and a draft nobody remembers to press Publish on is how the
          # releases page ends up describing a version no user can download.
          draft: false
          prerelease: ${{ steps.kind.outputs.prerelease }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/quiblo-*.apk
            app/build/outputs/apk/release/quiblo-*.apk.sha256
            app-tv/build/outputs/apk/release/quiblo-tv-*.apk
            app-tv/build/outputs/apk/release/quiblo-tv-*.apk.sha256
