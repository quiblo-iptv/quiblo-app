name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Called by release-on-main.yml, which is what runs on a merge to main. The gate a release
  # has to pass and the gate a pull request has to pass are the same gate, defined once —
  # a second copy of this file is a second place for the two to drift apart, and the copy
  # that matters least is the one that would be kept up to date.
  workflow_call:

# A new push to the same pull request cancels the previous run.
#
# **Keyed on the pull request, not on `github.workflow`.** A reusable workflow keeps its own
# concurrency but reports its *caller's* name in `github.workflow`, so the obvious spelling
# put every release run into one cancelling group: a second merge to main would cancel the
# first one's gate, and with it a release already halfway through signing. Falling back to
# `run_id` — unique per run — means a called run cancels nothing and is cancelled by nothing,
# which is the only safe behaviour when a tag is about to be cut from the result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What kind of change is this?
  #
  # A pull request that only edits prose does not need an Android build to be trusted, and this
  # repository was spending ten to eighteen minutes proving that a typo compiles. But the obvious
  # implementation of that idea — a `paths:` filter on the trigger — is a trap: a workflow that is
  # filtered out never reports its check at all, so a branch rule requiring that check waits for a
  # run that will never happen, forever. The decision therefore lives *inside* a job, so every
  # pull request still reports the same checks; some of them just finish in seconds.
  #
  # **Allowlist, not denylist.** Anything not named here counts as code. That direction is the
  # whole safety of this: a new source directory nobody thought about gets the full build by
  # default, and the failure mode of a wrong guess is a slow pull request rather than an unbuilt
  # one.
  scope:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The whole history, because this compares against the base branch rather than the
          # single commit that triggered the run.
          fetch-depth: 0

      - name: Classify the change
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Only a pull request can be docs-only. A push — which is how the release lane calls
          # this workflow — is decided by the caller, which knows whether it is about to publish
          # something. A gate that skipped itself on the way to a release would be worse than no
          # gate: see release-on-main.yml.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request. Everything runs."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # Prose, and nothing else.
          #
          # `docs/LICENSES.md` is deliberately **not** in this list even though it is a markdown
          # file in docs/. It is generated from the release runtime classpath and `licenceCheck`
          # compares the two, so editing it by hand is precisely the change that needs the build
          # that would catch it.
          #
          # `.github/**` is not here either. A workflow change is not user-facing and not app
          # code, and it is the one kind of change whose whole risk is that it does not work —
          # this file's own history has an entry where a broken block scalar published nothing
          # and looked like success.
          ALLOWED='^(docs/(?!LICENSES\.md)[^/]*\.md|agile/.*\.md|[^/]*\.md|LICENSE)$'

          OUTSIDE=$(echo "$CHANGED" | grep -vP "$ALLOWED" || true)

          if [ -z "$OUTSIDE" ]; then
            echo "::notice::Prose only — the Android build is skipped and the guards still run."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not prose only. These need the full build:"
            echo "$OUTSIDE" | sed 's/^/  /'
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # The checks that are seconds rather than minutes, and that a prose change can still fail.
  #
  # Every one of these is a grep or a parse. They run on every pull request whatever it touched,
  # because the two that matter most are exactly the ones prose can break: a provider URL or a
  # credential pasted into a document is the leak `AC-LEGAL-04` exists to prevent, and the
  # forbidden brand string is as forbidden in a paragraph as in a package name.
  guards:
    name: Guards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # No JDK, no Android SDK, no Gradle. Every step below is a grep or a parse, and setting up
      # a toolchain to run them would put two minutes back onto the thing this split exists to
      # make fast.

      # AC-LEGAL-04: no playlist, provider host or credential may ever enter the repo.
      # Cheap to check here, expensive to remove from history later.
      - name: Guard against leaked playlists and providers
        run: |
          set -euo pipefail
          if git grep -nIE '(^|[^A-Za-z])(get\.php\?username=|player_api\.php\?username=)' -- . ; then
            echo "::error::An Xtream-style provider URL with credentials is present. See AC-LEGAL-04."
            exit 1
          fi
          # The forbidden brand string. Two files legitimately contain it: FREEZE.md,
          # which is frozen and explains *why* it is forbidden, and this workflow, which
          # has to name it in order to search for it. Everywhere else is a violation.
          if git grep -nI 'VIPTV' -- . ':!docs/FREEZE.md' ':!.github/workflows/ci.yml' ; then
            echo "::error::The forbidden brand string must not appear outside docs/FREEZE.md (docs/FREEZE.md §1)."
            exit 1
          fi
          echo "No provider URLs or forbidden strings found."

      # AC-LEGAL-02. The sweep listed this as "re-checked on every CI run" while it was
      # in fact only ever run by hand, which is how a new module joins without headers.
      - name: GPLv3 header on every Kotlin source file
        run: |
          set -euo pipefail
          MISSING=0
          while IFS= read -r f; do
            if ! head -n 20 "$f" | grep -q 'GNU General Public License'; then
              echo "::error file=$f::Missing the GPLv3 header. See AC-LEGAL-02."
              MISSING=$((MISSING + 1))
            fi
          done < <(git ls-files '*.kt')
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING Kotlin file(s) have no GPLv3 header."
            exit 1
          fi
          echo "All tracked Kotlin files carry the GPLv3 header."

      # AC-NFR-08 forbids user-facing strings outside strings.xml, and a domain enum's name is
      # one with extra steps. `MediaKind.VOD` reached the favourites rows as "VOD" and
      # `SourceKind.XTREAM` reached the sources list as "XTREAM" (agile/012 #017) — both
      # untranslatable, and neither caught by anything.
      #
      # Scoped to the modules that can draw something. `:core:*` and `:source:*` are forbidden
      # from importing Compose by AC-NFR-06 and enforced at build time, so an enum name there
      # is a database or cache key and cannot reach a screen even in principle — twenty of
      # them are, and making people annotate those would train the annotation to be reflexive.
      #
      # Within the UI modules a grep still cannot tell display text from a cache key, so the
      # few legitimate uses say so on the line above. That is deliberately a small annoyance:
      # it is the one place where writing `kind.name` is a decision rather than a reflex.
      - name: No domain enum names used as display text (AC-NFR-08)
        run: |
          set -euo pipefail
          BAD=0
          while IFS= read -r hit; do
            file="${hit%%:*}"
            rest="${hit#*:}"
            line="${rest%%:*}"
            previous=$((line - 1))
            if [ "$previous" -lt 1 ] || ! sed -n "${previous}p" "$file" | grep -q 'not display text'; then
              echo "::error file=$file,line=$line::A domain enum's name is not display text. Use a string resource, or mark the line above with 'not display text' if it never reaches a screen."
              BAD=$((BAD + 1))
            fi
          done < <(git ls-files '*.kt' | grep -vE '^(core|source)/' | xargs grep -nE '\bkind\.name\b' || true)
          if [ "$BAD" -gt 0 ]; then
            echo "::error::$BAD use(s) of an enum name that may reach a screen."
            exit 1
          fi
          echo "No unmarked enum names in the UI modules."

      # Every workflow parses — including the ones this run is not.
      #
      # A pull request runs `ci.yml` and nothing else, so a YAML error in `release-on-main.yml`
      # or `release.yml` is invisible to the gate and surfaces on the merge, as a run with
      # **zero jobs** and no log to read. That happened on 2026-08-10: a shell line written
      # with real newlines instead of `\n` broke the block scalar, the release lane could not
      # be parsed at all, and the merge published nothing — which looked like the rule working
      # and was the lane being dead.
      #
      # The gate must check the files it is not running. This is the same lesson as `detektAll`
      # and as the first CI runs: code that has never been exercised is not code that works.
      # PyYAML is installed rather than assumed. The runner image happens to carry it today,
      # and a guard that silently stops running when an image changes is the failure it exists
      # to prevent.
      - name: Every workflow file parses
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          bad = 0
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
                  print(f"ok   {path}")
              except yaml.YAMLError as error:
                  print(f"::error file={path}::Not valid YAML: {error}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

  # Everything that needs an Android toolchain. Ten to eighteen minutes, and skipped when the
  # pull request is prose.
  build:
    name: Build, test and analyse
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Assemble
        run: ./gradlew assemble --stacktrace

      # AC-NFR-04, as restated by FREEZE.md Amendment 7.
      #
      # An application does not choose what its dependencies merge into its manifest, so the
      # criterion permits exactly two contributed permissions and names them. That is only a
      # criterion if a third one fails something — otherwise it is a clause that forgives
      # anything, which is the shape of guard this project has been caught by before.
      #
      # Read off the merged manifests rather than the sources: the sources are what we
      # declare, and the whole point is what arrives without us declaring it.
      - name: Permissions in the merged manifests (AC-NFR-04)
        run: |
          set -euo pipefail
          ALLOWED='^(android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|WAKE_LOCK)|dev\.quiblo\.(player|tv)(\.debug)?\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)$'
          # Test variants are excluded deliberately, not for convenience: the unit-test
          # manifest merges REORDER_TASKS from the test runner, and nothing in it is packaged
          # into an APK a user installs. The criterion is about what ships.
          MANIFESTS=$(find app/build app-tv/build -path '*merged_manifest*' -name AndroidManifest.xml 2>/dev/null \
            | grep -viE 'unittest|androidtest' || true)
          if [ -z "$MANIFESTS" ]; then
            echo "::error::No merged manifest found — this step must run after Assemble."
            exit 1
          fi
          UNEXPECTED=0
          for m in $MANIFESTS; do
            while IFS= read -r p; do
              [ -z "$p" ] && continue
              if ! printf '%s' "$p" | grep -qE "$ALLOWED"; then
                echo "::error file=$m::Unexpected permission '$p'. AC-NFR-04 names the two permitted contributed permissions; a third needs examining and naming in FREEZE.md Amendment 7."
                UNEXPECTED=$((UNEXPECTED + 1))
              fi
            done < <(grep -oE 'uses-permission android:name="[^"]*"' "$m" | sed 's/.*name="//; s/"$//' | sort -u)
          done
          if [ "$UNEXPECTED" -gt 0 ]; then
            echo "::error::$UNEXPECTED unexpected permission(s) in the merged manifests."
            exit 1
          fi
          echo "Merged manifests carry only the permissions AC-NFR-04 names."

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: detekt
        run: ./gradlew detektAll --stacktrace

      - name: Parser coverage (AC-NFR-07)
        run: ./gradlew coverageAll --stacktrace

      # AC-LEGAL-03, against the dependency graph rather than against somebody's memory.
      #
      # The in-app licence list is hand-written and was accurate only because people kept it so.
      # It had no mechanical relationship to what ships, which made its failure mode silent and
      # permanent: a dependency added in a pull request that nobody remembers to list is
      # attribution missing from every release after it, and nothing fails. The first run of
      # this check found 118 shipped modules listed nowhere — including one that is MIT, in a
      # file whose own comment said everything in it was Apache-2.0.
      - name: Licence attribution (AC-LEGAL-03)
        run: ./gradlew licenceCheck --stacktrace

      - name: Android Lint
        run: ./gradlew lint --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/detekt/
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore

  # One name that always reports, whatever the run decided to do.
  #
  # This is the job a branch rule should require, and the reason it exists is the trap this whole
  # file is arranged around: a required check that does not run is not a pass, it is a pull
  # request that can never be merged. `build` is skipped on a prose change, so requiring `build`
  # by name would jam exactly the pull requests this was meant to speed up.
  #
  # `if: always()` so it reports even when something upstream failed, and then it reads the
  # results itself — a needed job that failed must fail this, and a needed job that was *skipped*
  # must not. That distinction is the entire job.
  gate:
    name: Gate
    needs: [scope, guards, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report
        env:
          SCOPE: ${{ needs.scope.result }}
          GUARDS: ${{ needs.guards.result }}
          BUILD: ${{ needs.build.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE guards=$GUARDS build=$BUILD docs_only=${DOCS_ONLY:-unknown}"

          FAILED=0
          for result in "$SCOPE" "$GUARDS" "$BUILD"; do
            case "$result" in
              success|skipped) ;;
              *) FAILED=1 ;;
            esac
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::A gate job did not pass."
            exit 1
          fi

          if [ "${DOCS_ONLY:-}" = "true" ]; then
            echo "::notice::Prose only. The guards passed and the Android build was not run — see the scope job for what was read."
          fi
          echo "Gate green."
