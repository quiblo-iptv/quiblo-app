## Vibrato build properties.
## Licensed under GPLv3 — see LICENSE.

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is left off for M0. The AC-NFR-06 classpath assertion in
# build-logic resolves configurations at execution time; revisit when that check
# is rewritten against a lazily-captured provider.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# android.defaults.buildfeatures.* were removed in AGP 9; BuildConfig, resValues and
# shaders are all off by default now. :app opts back into BuildConfig explicitly.

kotlin.code.style=official
