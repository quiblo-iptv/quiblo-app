name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Called by release-on-main.yml, which is what runs on a merge to main. The gate a release
  # has to pass and the gate a pull request has to pass are the same gate, defined once —
  # a second copy of this file is a second place for the two to drift apart, and the copy
  # that matters least is the one that would be kept up to date.
  workflow_call:

# A new push to the same pull request cancels the previous run.
#
# **Keyed on the pull request, not on `github.workflow`.** A reusable workflow keeps its own
# concurrency but reports its *caller's* name in `github.workflow`, so the obvious spelling
# put every release run into one cancelling group: a second merge to main would cancel the
# first one's gate, and with it a release already halfway through signing. Falling back to
# `run_id` — unique per run — means a called run cancels nothing and is cancelled by nothing,
# which is the only safe behaviour when a tag is about to be cut from the result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and analyse
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # AC-LEGAL-04: no playlist, provider host or credential may ever enter the repo.
      # Cheap to check here, expensive to remove from history later.
      - name: Guard against leaked playlists and providers
        run: |
          set -euo pipefail
          if git grep -nIE '(^|[^A-Za-z])(get\.php\?username=|player_api\.php\?username=)' -- . ; then
            echo "::error::An Xtream-style provider URL with credentials is present. See AC-LEGAL-04."
            exit 1
          fi
          # The forbidden brand string. Two files legitimately contain it: FREEZE.md,
          # which is frozen and explains *why* it is forbidden, and this workflow, which
          # has to name it in order to search for it. Everywhere else is a violation.
          if git grep -nI 'VIPTV' -- . ':!docs/FREEZE.md' ':!.github/workflows/ci.yml' ; then
            echo "::error::The forbidden brand string must not appear outside docs/FREEZE.md (docs/FREEZE.md §1)."
            exit 1
          fi
          echo "No provider URLs or forbidden strings found."

      # AC-LEGAL-02. The sweep listed this as "re-checked on every CI run" while it was
      # in fact only ever run by hand, which is how a new module joins without headers.
      - name: GPLv3 header on every Kotlin source file
        run: |
          set -euo pipefail
          MISSING=0
          while IFS= read -r f; do
            if ! head -n 20 "$f" | grep -q 'GNU General Public License'; then
              echo "::error file=$f::Missing the GPLv3 header. See AC-LEGAL-02."
              MISSING=$((MISSING + 1))
            fi
          done < <(git ls-files '*.kt')
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING Kotlin file(s) have no GPLv3 header."
            exit 1
          fi
          echo "All tracked Kotlin files carry the GPLv3 header."

      - name: Assemble
        run: ./gradlew assemble --stacktrace

      # AC-NFR-04, as restated by FREEZE.md Amendment 7.
      #
      # An application does not choose what its dependencies merge into its manifest, so the
      # criterion permits exactly two contributed permissions and names them. That is only a
      # criterion if a third one fails something — otherwise it is a clause that forgives
      # anything, which is the shape of guard this project has been caught by before.
      #
      # Read off the merged manifests rather than the sources: the sources are what we
      # declare, and the whole point is what arrives without us declaring it.
      - name: Permissions in the merged manifests (AC-NFR-04)
        run: |
          set -euo pipefail
          ALLOWED='^(android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|WAKE_LOCK)|dev\.quiblo\.(player|tv)(\.debug)?\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)$'
          # Test variants are excluded deliberately, not for convenience: the unit-test
          # manifest merges REORDER_TASKS from the test runner, and nothing in it is packaged
          # into an APK a user installs. The criterion is about what ships.
          MANIFESTS=$(find app/build app-tv/build -path '*merged_manifest*' -name AndroidManifest.xml 2>/dev/null \
            | grep -viE 'unittest|androidtest' || true)
          if [ -z "$MANIFESTS" ]; then
            echo "::error::No merged manifest found — this step must run after Assemble."
            exit 1
          fi
          UNEXPECTED=0
          for m in $MANIFESTS; do
            while IFS= read -r p; do
              [ -z "$p" ] && continue
              if ! printf '%s' "$p" | grep -qE "$ALLOWED"; then
                echo "::error file=$m::Unexpected permission '$p'. AC-NFR-04 names the two permitted contributed permissions; a third needs examining and naming in FREEZE.md Amendment 7."
                UNEXPECTED=$((UNEXPECTED + 1))
              fi
            done < <(grep -oE 'uses-permission android:name="[^"]*"' "$m" | sed 's/.*name="//; s/"$//' | sort -u)
          done
          if [ "$UNEXPECTED" -gt 0 ]; then
            echo "::error::$UNEXPECTED unexpected permission(s) in the merged manifests."
            exit 1
          fi
          echo "Merged manifests carry only the permissions AC-NFR-04 names."

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: detekt
        run: ./gradlew detektAll --stacktrace

      - name: Parser coverage (AC-NFR-07)
        run: ./gradlew coverageAll --stacktrace

      - name: Android Lint
        run: ./gradlew lint --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/detekt/
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore
