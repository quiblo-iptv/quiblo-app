## Vibrato detekt configuration.
## buildUponDefaultConfig = true, so this file only records deliberate deviations.
## Licensed under GPLv3 — see LICENSE.

build:
  maxIssues: 0

style:
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: [ 'Composable' ]
    # An enum entry carrying its own value already *is* the named constant this rule asks
    # for: `THIRTY(30)` is not a magic number, and hoisting it to a companion object above
    # the entry that uses it would only put the name further from the value.
    ignoreEnums: true
  # Compose screen composables legitimately take many parameters via hoisting.
  UnusedPrivateMember:
    active: true
  ReturnCount:
    active: true
    max: 2
    # Guard clauses at the top of a function are idiomatic Kotlin and read better than
    # the nested alternative. This rule exists to catch tangled control flow, not these.
    excludeGuardClauses: true

complexity:
  LongParameterList:
    active: true
    # A Room @Query's parameters are the query's own filters. They cannot be bundled into a
    # parameter object — Room binds each one by name into the SQL — so this rule's usual
    # remedy is unavailable here, and the count measures how selective the query is rather
    # than a function doing too much.
    ignoreAnnotated: [ 'Composable', 'Query' ]
  TooManyFunctions:
    active: true
    ignoreAnnotatedFunctions: [ 'Composable' ]
    # Counting a nested listener's overrides against its outer class penalises
    # implementing a platform callback interface, which is not the coupling this rule
    # is meant to catch.
    ignorePrivate: true
    thresholdInClasses: 14
    # PlayerController is deliberately a wide seam. Concentrating every engine operation
    # behind one interface is what keeps Media3 out of the feature modules
    # (docs/FREEZE.md §4.4), so counting its methods measures the design working rather
    # than a class doing too much. Splitting it to satisfy the default would scatter the
    # boundary this rule would then not be watching at all.
    thresholdInInterfaces: 14
  # A @Composable is a declarative tree, not imperative logic: its length tracks how much
  # UI it describes, which is not the complexity this rule exists to catch. Extracting
  # sub-composables purely to satisfy a line count produces worse code, not better.
  # Non-composable functions stay capped.
  LongMethod:
    active: true
    threshold: 60
    ignoreAnnotated: [ 'Composable' ]

naming:
  # @Composable functions are PascalCase by convention and would otherwise be flagged.
  FunctionNaming:
    active: true
    ignoreAnnotated: [ 'Composable' ]
  TopLevelPropertyNaming:
    active: true

formatting:
  active: true
  MaximumLineLength:
    active: true
    maxLineLength: 140

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
