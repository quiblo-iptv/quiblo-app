# What this project actually resolves, told to GitHub. `agile/006` gate 6.
#
# Dependabot can read `gradle/libs.versions.toml` on its own, and that is not the same thing:
# the catalogue names about forty artifacts, and a Gradle build resolves several hundred once
# every transitive dependency is included. **The vulnerable one is nearly always transitive** —
# nobody adds a bad library on purpose, they add a good one that depends on it.
#
# This job resolves the real graph and submits it, which is what makes two other things true:
# alerts cover what we ship rather than what we typed, and the dependency review on a pull
# request has a base to compare against.
name: Dependency graph

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Submitting a snapshot is a write against the repository's dependency graph, and that is the
# only thing this workflow may do. It touches no code and holds no signing secret.
permissions:
  contents: write

# Never cancelled, but only one at a time: two merges landing together would otherwise submit
# two snapshots of different trees and the later result would be whichever finished last.
concurrency:
  group: dependency-graph
  cancel-in-progress: false

jobs:
  submit:
    name: Resolve and submit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The same JDK the gate uses. A different one resolves a different graph, and a snapshot
      # that does not match what CI builds is a snapshot describing a build nobody runs.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Resolve and submit the dependency graph
        uses: gradle/actions/dependency-submission@v6
